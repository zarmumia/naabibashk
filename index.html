/* פריסה: חנות-גלריה, קיר טיח בהיר, תמונות ממוסגרות כמו בבית, טקסט מימין */
:root{
  --paper:#FBF7F0; --wall:#E6F2F1; --ink:#0A2A4D; --ink-soft:#3D5672;
  --sand:#C85A12; --line:rgba(10,42,77,.15); --card:#FFFFFF; --accent:#2C5DB0;
  --ok:#2E7D4F; --teal:#17B0AB; --magenta:#A51A78;
  --display:'Assistant',sans-serif;--print:'Bat Kol','Assistant',sans-serif;
  --body:'Assistant',sans-serif;
  color-scheme:only light;
}
:root[data-theme="dark"]{
  --paper:#0B1A3A; --wall:#102654; --ink:#F3F7F8; --ink-soft:#B3C3E6; --sand:#F5A25E;
  --line:rgba(243,247,248,.15); --card:#13295A; --accent:#7FA2EC; --ok:#7FCB98; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:400;font-size:17px;line-height:1.6;direction:rtl;font-synthesis:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,.disp{line-height:1.35;font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}

/* כותרת */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;text-decoration:none;letter-spacing:.3px;display:flex;align-items:center;gap:12px;line-height:1.1;color:var(--ink)}
.brand img{width:54px;height:54px;display:block;flex:none}
.brand span{display:flex;flex-direction:column}

.brand small{font-family:var(--body);font-size:13px;letter-spacing:.4px;color:var(--ink-soft);margin-top:3px}
nav{display:flex;gap:22px;align-items:center;font-size:16px}
nav a{text-decoration:none;color:var(--ink-soft)}
nav a:hover{color:var(--ink)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:none;padding:6px 14px;border-radius:999px;font-size:15px}
.cartbtn b{font-variant-numeric:tabular-nums;font-weight:600}

/* פתיח */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:48px 56px}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:1.08}
.hero p{color:var(--ink-soft);max-width:30em;margin:18px 0 26px;font-size:18px}
.hero img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:12px 26px;border-radius:2px;border:0;font-size:16px;letter-spacing:.3px}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
:root[data-theme="dark"] .cta:not(.ghost){color:var(--paper)}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:30px;font-size:14px;color:var(--ink-soft)}
.facts span::before{content:"·";margin-left:8px;color:var(--sand)}


/* פתיח נעביבשק */
.bhero{position:relative;background:#2C5DB0 url(img/hero.jpg) center 84%/cover no-repeat;min-height:min(78vh,640px);display:flex;align-items:center;padding:clamp(28px,6vw,72px) 16px}
.bhero .card{width:100%;max-width:540px;margin:0;margin-inline-start:max(0px,calc((100% - 1180px)/2));background:var(--paper);border:3px solid var(--accent);outline:6px solid var(--paper);border-radius:18px;padding:clamp(24px,4vw,44px) clamp(20px,4vw,48px);display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,36px);align-items:center;box-shadow:0 18px 40px rgba(6,30,56,.35)}
.bhero img{width:clamp(96px,11vw,130px);height:auto;display:block}
/* קשת מרוקאית מחודדת בראש הכרטיס */
.bhero .card{position:relative;border-top:0;border-radius:0 0 18px 18px;outline:none;box-shadow:0 0 0 6px var(--paper);margin-top:clamp(96px,16vw,160px)}
/* צורת שער: כרטיס צר וגבוה גם במחשב, כמו בטלפון */
.bhero .card{max-width:470px;grid-template-columns:1fr;text-align:center;justify-items:center;padding-top:clamp(8px,1.5vw,16px)}
.bhero .btns{justify-content:center}
/* כפתורים סימטריים: אותו רוחב, זה לצד זה במחשב וזה מעל זה בנייד */
.bhero .card .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px;margin-inline:auto}
.bhero .card .btns .cta{display:flex;align-items:center;justify-content:center;text-align:center;margin:0;min-height:52px;box-sizing:border-box}
@media (max-width:480px){.bhero .card .btns{grid-template-columns:1fr;max-width:280px}}
.bhero .arch{position:absolute;left:-3px;width:calc(100% + 6px);bottom:calc(100% - 1px);height:clamp(96px,16vw,160px);overflow:visible;pointer-events:none}
.bhero h1{font-size:clamp(44px,5.5vw,68px);line-height:1;color:var(--ink)}
.bhero .tag{font-family:var(--display);font-size:clamp(20px,2.6vw,28px);color:var(--accent);margin:6px 0 14px}
.bhero p{margin:0 0 22px;color:var(--ink-soft);max-width:28em}
.bhero .btns{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:620px){.bhero .card{grid-template-columns:1fr;text-align:center;justify-items:center}.bhero .btns{justify-content:center}}

.banner{width:100%;aspect-ratio:16/5;object-fit:cover;display:block;margin-bottom:28px;border-radius:4px}
@media (max-width:620px){.banner{aspect-ratio:16/8}}
/* מבצע */
.deal{background:var(--wall);border-block:1px solid var(--line)}
.deal .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-block:18px 10px;font-size:15px;max-width:640px;margin-inline:auto}
.deal .all{text-align:center;font-size:13px;opacity:.75;padding-bottom:16px}
.deal .d{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.deal b{font-family:var(--display);font-size:24px;font-weight:700}
.deal .ds{font-size:13px;opacity:.75}
.tripcol{display:flex;flex-direction:column;gap:18px}
.tripcol .deal{border:1px solid var(--line);border-radius:4px}
.tripcol .deal .wrap{max-width:none;padding-inline:12px}

/* גלריה */
.sec{padding-block:64px;scroll-margin-top:96px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(30px,4vw,44px)}
.sec-h p{margin:0;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
.item{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.item .ph{overflow:hidden}
.fc{position:relative;overflow:hidden;aspect-ratio:809/1046;display:block;box-shadow:0 0 0 1px rgba(60,45,30,.10),0 2px 4px rgba(60,45,30,.10),0 10px 22px -6px rgba(60,45,30,.22)}
.fc img{position:absolute;width:123.61%!important;max-width:none;height:auto!important;aspect-ratio:auto!important;left:-11.87%;top:-10.9%;object-fit:fill!important}
.item img{width:100%;aspect-ratio:832/1171;object-fit:cover;display:block;transition:transform .5s ease}
.item:hover img{transform:scale(1.03)}
.item h3{font-size:28px;line-height:1.2}
.item .sub{color:var(--ink-soft);font-size:15px;margin-top:-6px}
.item .pr{margin-top:auto;font-size:16px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.item .go{font-size:14px;color:var(--ink-soft);border-bottom:1px solid currentColor;white-space:nowrap}.item:hover .go{color:var(--accent)}
.letter{font-family:var(--display);color:var(--sand);margin-inline-end:8px}

/* עמוד מוצר */
.pp{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding-block:40px 64px;align-items:start}
.pp>div{min-width:0}
.pp .main{}
.pp .main img{width:100%;aspect-ratio:832/1171;object-fit:cover;display:block}
.pp .main a{display:block;cursor:zoom-in}
.singles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.singles img{width:100%;aspect-ratio:832/1171;object-fit:cover;display:block}
@media (max-width:700px){.singles{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;-webkit-overflow-scrolling:touch}.singles a{flex:0 0 82%;scroll-snap-align:center}}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{padding:0;border:1px solid transparent;background:none;width:76px}
.thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.back{display:inline-block;margin-top:24px;color:var(--ink-soft);text-decoration:none;font-size:15px}
.pp h1{font-size:clamp(38px,5vw,60px);line-height:1.1}
.pp .by{color:var(--ink-soft);margin:6px 0 22px}
.opt{border:0;padding:0;margin:0 0 22px}
.opt legend{font-size:14px;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1px solid var(--line);background:var(--card);padding:14px;text-align:right;border-radius:2px;display:flex;flex-direction:column;gap:2px}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice .t{font-family:var(--display);font-size:21px}
.choice .d{font-size:13px;color:var(--ink-soft)}
.choice .p{font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:6px 12px 6px 14px;border-radius:999px;font-size:15px}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.qty{display:flex;align-items:center;border:1px solid var(--line);background:var(--card)}

.add{flex:1;min-width:180px;height:46px}
.spec{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:15px;color:var(--ink-soft);display:grid;gap:8px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:15px;z-index:20}

.line .m{font-size:14px;color:var(--ink-soft)}

.empty{padding:40px 0;color:var(--ink-soft)}

.f{display:grid;gap:4px}
.f label{font-size:14px;color:var(--ink-soft)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:14px;background:var(--wall);padding:12px 14px;border-radius:2px}

.toast .tgo{color:inherit;font-weight:600;text-decoration:underline;margin-inline-start:6px;white-space:nowrap}
footer .fcontact a{color:inherit}

.soon{font-size:13px;color:var(--ink-soft)}

// שבת וחג: לא מוכרים מ־14:00 בערב שבת/חג עד 21:00 במוצאי, שעון ישראל
// ימים טובים בארץ: ראש השנה, יום כיפור, סוכות, שמיני עצרת, פסח (ראשון ושביעי), שבועות. לעדכן אחרי 2031
const YOMTOV=new Set(['2027-04-22','2027-04-28','2027-06-11','2027-10-02','2027-10-03','2027-10-11','2027-10-16','2027-10-23','2028-04-11','2028-04-17','2028-05-31','2028-09-21','2028-09-22','2028-09-30','2028-10-05','2028-10-12','2029-03-31','2029-04-06','2029-05-20','2029-09-10','2029-09-11','2029-09-19','2029-09-24','2029-10-01','2030-04-18','2030-04-24','2030-06-07','2030-09-28','2030-09-29','2030-10-07','2030-10-12','2030-10-19','2031-04-08','2031-04-14','2031-05-28']);
function isShabbat(){
  const fmt=(d,o)=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',Object.assign({timeZone:'Asia/Jerusalem'},o)).formatToParts(d).map(x=>[x.type,x.value]));
  const now=new Date(), p=fmt(now,{weekday:'short',hour:'numeric',hour12:false,year:'numeric',month:'2-digit',day:'2-digit'});
  const h=+p.hour%24, today=`${p.year}-${p.month}-${p.day}`;
  const t=fmt(new Date(now.getTime()+864e5),{year:'numeric',month:'2-digit',day:'2-digit'}), tomorrow=`${t.year}-${t.month}-${t.day}`;
  const holy=d=>YOMTOV.has(d), wd=p.weekday;
  return ((wd==='Sat'||holy(today))&&h<21) || ((wd==='Fri'||holy(tomorrow))&&h>=14) || (wd==='Sat'&&holy(tomorrow)) || (holy(today)&&(wd==='Fri'||holy(tomorrow)));
}
